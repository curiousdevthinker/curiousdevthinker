  <g opacity=".7"><path d="M0 66H1200" stroke="#30363D"/><circle cx="29" cy="33" r="6" fill="#F85149"/><circle cx="51" cy="33" r="6" fill="#D29922"/><circle cx="73" cy="33" r="6" fill="#3FB950"/><text x="600" y="39" text-anchor="middle" fill="#6E7681" font-family="Consolas, 'Courier New', monospace" font-size="12">gokul@rural-tech: ~/profile</text></g>
  <g transform="translate(62 104)"><text x="0" y="22" fill="#3FB950" font-family="Consolas, 'Courier New', monospace" font-size="16">$ whoami</text><text x="0" y="91" fill="#F0F6FC" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.8">GOKUL DEV B</text><text x="3" y="132" fill="#58A6FF" font-family="Consolas, 'Courier New', monospace" font-size="20">software_engineer / rural_technologies</text><text x="3" y="177" fill="#8B949E" font-family="Consolas, 'Courier New', monospace" font-size="14">Building reliable systems for the world beyond the screen.</text><rect x="3" y="200" width="244" height="3" rx="1.5" fill="#21262D"/><rect x="3" y="200" width="151" height="3" rx="1.5" fill="#3FB950"/></g>
  <g transform="translate(780 93)" filter="url(#shadow)"><rect width="354" height="216" rx="12" fill="#090D13" stroke="#30363D"/><path d="M0 38H354" stroke="#21262D"/><text x="18" y="25" fill="#6E7681" font-family="Consolas, 'Courier New', monospace" font-size="11">engineer.ts</text><text x="18" y="68" fill="#FF7B72" font-family="Consolas, 'Courier New', monospace" font-size="13">const</text><text x="62" y="68" fill="#D2A8FF" font-family="Consolas, 'Courier New', monospace" font-size="13">build</text><text x="103" y="68" fill="#C9D1D9" font-family="Consolas, 'Courier New', monospace" font-size="13">= async () =&gt; {</text><text x="34" y="97" fill="#79C0FF" font-family="Consolas, 'Courier New', monospace" font-size="13">await</text><text x="79" y="97" fill="#D2A8FF" font-family="Consolas, 'Courier New', monospace" font-size="13">understand</text><text x="149" y="97" fill="#C9D1D9" font-family="Consolas, 'Courier New', monospace" font-size="13">(field);</text><text x="34" y="126" fill="#79C0FF" font-family="Consolas, 'Courier New', monospace" font-size="13">await</text><text x="79" y="126" fill="#D2A8FF" font-family="Consolas, 'Courier New', monospace" font-size="13">design</text><text x="128" y="126" fill="#C9D1D9" font-family="Consolas, 'Courier New', monospace" font-size="13">(system);</text><text x="34" y="155" fill="#79C0FF" font-family="Consolas, 'Courier New', monospace" font-size="13">return</text><text x="90" y="155" fill="#D2A8FF" font-family="Consolas, 'Courier New', monospace" font-size="13">deploy</text><text x="139" y="155" fill="#C9D1D9" font-family="Consolas, 'Courier New', monospace" font-size="13">({ reliable:</text><text x="257" y="155" fill="#79C0FF" font-family="Consolas, 'Courier New', monospace" font-size="13">true</text><text x="288" y="155" fill="#C9D1D9" font-family="Consolas, 'Courier New', monospace" font-size="13">});</text><text x="18" y="184" fill="#C9D1D9" font-family="Consolas, 'Courier New', monospace" font-size="13">};</text><rect x="45" y="171" width="7" height="16" rx="1" fill="#3FB950"/></g>
  <text x="1140" y="338" text-anchor="end" fill="#484F58" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="1.8">CODE · FIELD · IMPACT</text>
