<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Gokul Dev B — Software Engineer</title>
  <desc id="desc">Dark developer terminal banner with code, grid lines, and green and blue accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#070B11"/><stop offset=".52" stop-color="#0D1117"/><stop offset="1" stop-color="#101923"/></linearGradient>
    <radialGradient id="blue" cx="0" cy="0" r="1" gradientTransform="translate(882 60) rotate(120) scale(324 486)" gradientUnits="userSpaceOnUse"><stop stop-color="#58A6FF" stop-opacity=".18"/><stop offset="1" stop-color="#58A6FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="green" cx="0" cy="0" r="1" gradientTransform="translate(1124 312) rotate(-143) scale(302 410)" gradientUnits="userSpaceOnUse"><stop stop-color="#3FB950" stop-opacity=".15"/><stop offset="1" stop-color="#3FB950" stop-opacity="0"/></radialGradient>
